modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Eiriksb/Stad/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
Build a town with citizens who live, work, love, gossip and remember. Every citizen is run by a small local AI:
talk to them by typing or with your voice, give them jobs and homes, and plan buildings with your builder in plain
words. Lead them well, or they'll refuse your orders, go on strike, or move to a rival's town. Built on They Will Talk.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="theywilltalk"
    type="required"
    versionRange="${twt_version_range}"
    ordering="AFTER"
    side="BOTH"
